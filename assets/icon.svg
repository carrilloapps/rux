<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="rux">
  <title>rux</title>
  <desc>A terminal window whose prompt sweeps four Windows panes clean.</desc>

  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2530" />
      <stop offset="1" stop-color="#0D1218" />
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0" />
      <stop offset="0.45" stop-color="#22D3EE" stop-opacity="0.85" />
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Terminal body: rux lives in the shell. -->
  <rect x="16" y="24" width="224" height="208" rx="26" fill="url(#shell)" />
  <rect x="16" y="24" width="224" height="208" rx="26" fill="none" stroke="#2C3A48" stroke-width="3" />

  <!-- Title bar with the three window dots. -->
  <path d="M16 50a26 26 0 0 1 26-26h172a26 26 0 0 1 26 26v10H16z" fill="#223040" />
  <circle cx="44" cy="42" r="5.5" fill="#F87171" />
  <circle cx="64" cy="42" r="5.5" fill="#FBBF24" />
  <circle cx="84" cy="42" r="5.5" fill="#34D399" />

  <!-- The four panes rux inspects: startup, leftovers, junk, hardware.
       Each carries the status mark the interface uses for that state. -->
  <g transform="translate(150 84)">
    <rect x="0" y="0" width="32" height="26" rx="5" fill="#34D399" opacity="0.92" />
    <rect x="40" y="0" width="32" height="26" rx="5" fill="#FBBF24" opacity="0.72" />
    <rect x="0" y="34" width="32" height="26" rx="5" fill="#38BDF8" opacity="0.72" />
    <rect x="40" y="34" width="32" height="26" rx="5" fill="#F87171" opacity="0.62" />
  </g>

  <!-- Prompt: the caret and the sweep that clears the line. -->
  <path d="M44 104l26 24-26 24" fill="none" stroke="#22D3EE" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="44" y="168" width="98" height="12" rx="6" fill="url(#sweep)" />
  <rect x="150" y="168" width="20" height="12" rx="6" fill="#22D3EE" />

  <!-- Baseline: the machine rux reports on. -->
  <rect x="44" y="200" width="168" height="6" rx="3" fill="#2C3A48" />
</svg>
