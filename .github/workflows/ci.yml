name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: '1'

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    # rux targets Windows and its adapters shell out to PowerShell, so the
    # verification that matters runs on Windows.
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The dev toolchain needs 22.13 or newer: eslint-visitor-keys and
        # Vitest's coverage packages declare it. The published bundle's own
        # floor is lower and is proved by the `floor` job below.
        node: ['22.13.0', '24.x']

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Smoke-test the built CLI
        run: |
          node dist/main.js --version
          node dist/main.js --help
          node dist/main.js startup --list --lang en-US
          node dist/main.js startup --list --lang es-VE
          node dist/main.js clean --json --class startup > $env:TEMP\rux-clean.json
          node dist/main.js hardware --json > $env:TEMP\rux-hardware.json
        shell: pwsh

  floor:
    name: Run the bundle on the declared engine floor
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up the build toolchain
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # package.json promises the published bundle runs on this version, and the
      # bundle ships with no dependencies, so the promise is testable directly
      # even though the toolchain that built it needs something newer.
      - name: Switch to the declared minimum
        uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'

      - name: Run the bundle there
        shell: pwsh
        run: |
          node --version
          node dist/main.js --version
          node dist/main.js --help | Out-Null
          node dist/main.js startup --list --lang en-US | Out-Null
          node dist/main.js hardware --json | ConvertFrom-Json | Out-Null

  coverage:
    name: Coverage
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14
