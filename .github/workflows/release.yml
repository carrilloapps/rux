name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the leading v (dry run only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows distribution
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      version: ${{ steps.resolve.outputs.version }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve version from the release tag
        id: resolve
        shell: pwsh
        run: |
          # The tag is the only place a version is authored. package.json is
          # rewritten from it so the npm package, the bundled --version output,
          # the installer and the release assets cannot drift apart.
          if ('${{ github.event_name }}' -eq 'release') {
            $tag = '${{ github.event.release.tag_name }}'
          } elseif ('${{ inputs.version }}') {
            $tag = '${{ inputs.version }}'
          } else {
            $tag = (Get-Content package.json -Raw | ConvertFrom-Json).version
          }

          node scripts/set-version.mjs $tag
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building rux $version"

      - name: Verify
        run: npm run verify

      - name: Build bundle
        run: npm run build

      - name: Stage the Windows distribution
        # Uses the runner's own Node, which .nvmrc pins, as the embedded runtime.
        run: npm run package:windows

      - name: Smoke-test the staged build in isolation
        shell: pwsh
        run: |
          # Copied out of the checkout first. Run it in place and the repository's
          # node_modules satisfies imports the distribution has to carry itself,
          # which is exactly how a build that cannot start shipped once already.
          $isolated = Join-Path $env:RUNNER_TEMP 'rux-isolated'
          Remove-Item -Recurse -Force $isolated -ErrorAction SilentlyContinue
          Copy-Item -Recurse build\stage $isolated
          if (Test-Path (Join-Path $isolated 'node_modules')) {
            throw 'The staged distribution must not ship node_modules'
          }

          $rux = Join-Path $isolated 'rux.cmd'
          $reported = (& $rux --version).Trim()
          if ($reported -ne '${{ steps.resolve.outputs.version }}') {
            throw "Version mismatch: expected ${{ steps.resolve.outputs.version }}, got $reported"
          }

          # A distribution that builds but cannot read the system is not a release.
          & $rux --help | Out-Null
          & $rux startup --list --lang en-US
          & $rux startup --list --lang es-VE | Out-Null
          & $rux backups | Out-Null
          & $rux clean --json --class startup | ConvertFrom-Json | Out-Null
          & $rux junk --json | ConvertFrom-Json | Out-Null
          & $rux hardware --json | ConvertFrom-Json | Out-Null
          Write-Host 'Isolated smoke test passed.'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found at $compiler" }
          & $compiler "/DAppVersion=${{ steps.resolve.outputs.version }}" installer\rux.iss
          $installer = "build\rux-${{ steps.resolve.outputs.version }}-setup.exe"
          if (-not (Test-Path $installer)) { throw 'Inno Setup did not produce the installer' }

      - name: Create portable archive
        shell: pwsh
        run: |
          Compress-Archive -Path 'build\stage\*' -DestinationPath "build\rux-${{ steps.resolve.outputs.version }}-win-x64.zip" -Force

      - name: Generate checksums
        shell: pwsh
        run: |
          Push-Location build
          Get-ChildItem -File | Where-Object { $_.Extension -in '.exe', '.zip' } |
            ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Path SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt
          Pop-Location

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rux-windows-${{ steps.resolve.outputs.version }}
          path: |
            build/rux-*-setup.exe
            build/rux-*-win-x64.zip
            build/SHA256SUMS.txt
          retention-days: 30

      - name: Attach assets to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/rux-*-setup.exe
            build/rux-*-win-x64.zip
            build/SHA256SUMS.txt
          fail_on_unmatched_files: true

  publish-npm:
    name: Publish to npm
    needs: build-windows
    if: github.event_name == 'release'
    # package.json declares os: win32, which makes npm ci refuse to install the
    # package's own tree anywhere else. The publish therefore runs on Windows.
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Required for npm provenance attestation.
      id-token: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply the release version
        run: node scripts/set-version.mjs "${{ github.event.release.tag_name }}"

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
